<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareRoute — Hackathon Deck · Team Tech Head</title>
<style>
  :root { --blue:#0719C8; --orange:#FFAA16; --magenta:#F3265B; --yellow:#FFD21A; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:#05060f; overflow:hidden;
              font-family:"Segoe UI", system-ui, Arial, sans-serif; color:#fff; }
  #stage { position:absolute; inset:0 0 64px 0; display:flex; align-items:center;
           justify-content:center; background:#05060f; }
  #slide { max-width:100%; max-height:100%; box-shadow:0 12px 60px rgba(7,25,200,.35);
           user-select:none; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:64px; display:flex;
         align-items:center; gap:14px; padding:0 18px; background:rgba(7,25,200,.92); }
  button { background:var(--yellow); color:#080808; border:0; border-radius:999px;
           font-weight:700; font-size:14px; padding:9px 18px; cursor:pointer; }
  button.ghost { background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.55); }
  #count { font-weight:700; letter-spacing:.06em; color:var(--yellow); min-width:64px;
           text-align:center; }
  #title { flex:1; font-size:13px; opacity:.85; white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; }
  #notesPanel { position:absolute; right:0; top:0; bottom:64px; width:min(420px,42vw);
                background:rgba(8,8,8,.96); padding:20px 22px; overflow:auto;
                transform:translateX(100%); transition:transform .25s ease;
                border-left:3px solid var(--orange); }
  #notesPanel.open { transform:none; }
  #notesPanel h3 { margin:0 0 10px; color:var(--orange); font-size:13px;
                   letter-spacing:.12em; }
  #notesPanel p { font-size:14px; line-height:1.55; color:#e8ecfb; }
  .hint { position:absolute; left:18px; top:14px; font-size:12px; color:#9aa3c7; }
</style>
</head>
<body>
<div id="stage"><img id="slide" alt="CareRoute deck slide"></div>
<div class="hint">← / → or click sides · N notes · F fullscreen</div>
<div id="notesPanel"><h3>SPEAKER NOTES</h3><p id="notesText"></p></div>
<div id="bar">
  <button id="prev">‹ Prev</button>
  <button id="next">Next ›</button>
  <span id="count">1 / 10</span>
  <span id="title">CareRoute — Emergency Bed Coordination System · Team Tech Head</span>
  <button class="ghost" id="notesBtn">Notes</button>
  <button class="ghost" id="fsBtn">Fullscreen</button>
</div>
<script src="notes.js"></script>
<script>
const TITLES = [
  "Problem & Introduction", "The Real-World Problem", "Our Solution: One Workflow",
  "What Is New & Innovative", "Technology & Architecture", "Live Demo Workflow",
  "Security & Access Control", "Business Model", "Future Roadmap", "Impact, Vision & Team"];
let i = 0;
const N = 10;
const img = document.getElementById('slide');
function show(k){
  i = Math.max(0, Math.min(N-1, k));
  img.src = 'slide' + String(i+1).padStart(2,'0') + '.png';
  document.getElementById('count').textContent = (i+1) + ' / ' + N;
  document.getElementById('title').textContent =
    'CareRoute · ' + TITLES[i] + ' — Team Tech Head';
  document.getElementById('notesText').textContent = (window.NOTES || [])[i] || '';
}
document.getElementById('prev').onclick = e => { e.stopPropagation(); show(i-1); };
document.getElementById('next').onclick = e => { e.stopPropagation(); show(i+1); };
document.getElementById('notesBtn').onclick = () =>
  document.getElementById('notesPanel').classList.toggle('open');
document.getElementById('fsBtn').onclick = () =>
  (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(i+1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i-1);
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(N-1);
  if (e.key.toLowerCase() === 'n') document.getElementById('notesPanel').classList.toggle('open');
  if (e.key.toLowerCase() === 'f') document.getElementById('fsBtn').click();
});
document.getElementById('stage').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  show((e.clientX - r.left) > r.width/2 ? i+1 : i-1);
});
for (let k=1; k<=N; k++) { const im = new Image(); im.src = 'slide' + String(k).padStart(2,'0') + '.png'; }
show(0);
</script>
</body>
</html>
